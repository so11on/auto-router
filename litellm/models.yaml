# Model registry: one entry per LiteLLM model_name (config.yaml). Used for context control and quota prediction.
# context: input window in tokens. For OmniRoute combos it is the SMALLEST window among the combo members, because any
#          member may answer (OmniRoute's /v1/models reports the largest, which is misleading).
# paid:    true if a call can cost money (false for free tiers and for the Claude subscription via the CLI bridge).
# quota:   which quota tracker applies (see quota.py):
#            claude-subscription  -> utilization reported by Claude Code (`rate_limit_event.unifiedWindows`)
#            counted              -> our own counters against `limits` below
#            none                 -> billed per token, no hard quota we can see
# limits:  only numbers we measured or that the provider publishes; "source" says which. Missing = unknown.
# privacy: privacy class used by SAFETY_MODE / SENSITIVE_GUARD (see litellm/safety.py and docs/SECURITY.md):
#            trusted       paid, terms say prompts are not used for training          -> may receive sensitive content
#            no_retention  declares no training and no retention (free or paid)       -> sensitive content only if allowed in SENSITIVE_ALLOWED_CLASSES
#            restricted    stable provider but jurisdiction/retention not acceptable  -> ordinary prompts only, NEVER sensitive content
#            unsafe        may log/train/human-review, unknown policy, random host    -> removed from every route when SAFETY_MODE=on
#            pool          computed at run time: the worst class among the verified OmniRoute pool members (data/pool-members.json)
#          A model without `privacy` is treated as unsafe.
# Verified 2026-10-24: Gemini and Claude windows from LiteLLM model info and Claude Code `modelUsage.contextWindow`;
# pool windows from OmniRoute /v1/models per member model.
# --- routing v3 fields (docs/ROUTING.md) ---
# vendor / abbr   who makes it; the short name used in routing.yaml `aliases` and in docs
# fit             suitability 0-5 per task type. ESTIMATES (the plan marks them [E]); calibrate with real tasks (docs/ROUTING.md, "Calibration")
# vision, tools   0-5: image understanding; reliability of tool calls (agent mode filters on `tools`)
# verbosity       how many more output tokens than a baseline model it tends to write (cost estimate)
# price           USD per 1M tokens {in, out}; `schedule` = later prices from a date; `long_context` = other price above N prompt tokens;
#                 `offpeak_utc` + `offpeak` = DeepSeek's discount window (the base price is the peak price)
# subscription    true = used through a plan (CLI): no per-call money, but a scarcity factor applies while the plan has room
# overhead_cli    tokens the CLI adds to every call (estimate, measure with `ar.mjs usage`)
# needs           environment variable that must be set for the model to be available
# needs_pool / via / omni   served through OmniRoute; `omni` is the id that must appear in data/pool-members.json (verified by `ar.mjs omniroute`)
# pin_only        never chosen by the router, only by an explicit pin;  internal: used by the gateway itself, never chosen for a user task
# Prices and fit numbers come from the vendors and from independent tests collected on 2026-10-24; they are data, change them here, not in code.

